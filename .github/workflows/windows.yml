name: Windows build
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test --locked
      - name: Build
        run: cargo build --release --locked
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item target/release/CraftLauncher.exe dist/CraftLauncher.exe
          $hash = (Get-FileHash dist/CraftLauncher.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  CraftLauncher.exe" | Set-Content dist/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: CraftLauncher-Windows-x64
          path: dist/*
      - name: Prepare draft release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ($tag -ne "v$version") { throw 'Tag must match Cargo.toml version' }
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            $flags = @('--draft', '--title', "CraftLauncher $tag", '--notes-file', 'RELEASE_NOTES.md')
            if ([Version]$version -lt [Version]'1.0.0') { $flags += '--prerelease' }
            gh release create $tag @flags
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          }
          gh release upload $tag dist/CraftLauncher.exe dist/SHA256SUMS.txt --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
